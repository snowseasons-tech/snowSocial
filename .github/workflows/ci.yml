name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check app.js

  backend:
    name: Backend lint, migrations, and image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: snowsocial_ci
          POSTGRES_USER: snowsocial_ci
          POSTGRES_PASSWORD: ci_password_for_snowSocial
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowsocial_ci -d snowsocial_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://snowsocial_ci:ci_password_for_snowSocial@localhost:5432/snowsocial_ci
      POSTGRES_PASSWORD: ci_password_for_snowSocial
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt ruff==0.17.3
      - name: Lint backend
        run: ruff check backend/app
      - name: Check Python syntax
        run: python -m compileall -q backend/app
      - name: Apply and verify database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag snowsocial-api:ci backend
