services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: snowsocial
      POSTGRES_USER: snowsocial_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowsocial_app -d snowsocial"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - snowsocial_db:/var/lib/postgresql

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://snowsocial_app:${POSTGRES_PASSWORD}@db:5432/snowsocial
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SNOWSOCIAL_ADMIN_USERNAME: ${SNOWSOCIAL_ADMIN_USERNAME:-}
      SNOWSOCIAL_ADMIN_PASSWORD: ${SNOWSOCIAL_ADMIN_PASSWORD:-}
      SNOWSOCIAL_COOKIE_SECURE: ${SNOWSOCIAL_COOKIE_SECURE:-false}
      META_FRONTEND_URL: ${META_FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/connections/google/callback}
      GOOGLE_FRONTEND_URL: ${GOOGLE_FRONTEND_URL:-http://localhost:8080}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8000/api/connections/linkedin/callback}
      LINKEDIN_FRONTEND_URL: ${LINKEDIN_FRONTEND_URL:-http://localhost:8080}
      LINKEDIN_ORGANIZATION_ID: ${LINKEDIN_ORGANIZATION_ID:-}
      LINKEDIN_ORGANIZATION_NAME: ${LINKEDIN_ORGANIZATION_NAME:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202610}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-http://localhost:8000/api/connections/x/callback}
      X_FRONTEND_URL: ${X_FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://snowsocial_app:${POSTGRES_PASSWORD}@db:5432/snowsocial
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
      ANALYTICS_SYNC_INTERVAL_SECONDS: ${ANALYTICS_SYNC_INTERVAL_SECONDS:-86400}
      ANALYTICS_SYNC_BATCH_SIZE: ${ANALYTICS_SYNC_BATCH_SIZE:-50}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      META_FACEBOOK_PAGE_ID: ${META_FACEBOOK_PAGE_ID:-}
      META_INSTAGRAM_ACCOUNT_ID: ${META_INSTAGRAM_ACCOUNT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_LOCATION_ID: ${GOOGLE_BUSINESS_LOCATION_ID:-}
      GOOGLE_BUSINESS_LANGUAGE_CODE: ${GOOGLE_BUSINESS_LANGUAGE_CODE:-en-US}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_ORGANIZATION_ID: ${LINKEDIN_ORGANIZATION_ID:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202610}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_ANALYTICS_ENABLED: ${X_ANALYTICS_ENABLED:-false}
      X_ANALYTICS_SYNC_INTERVAL_SECONDS: ${X_ANALYTICS_SYNC_INTERVAL_SECONDS:-604800}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["publishing"]

volumes:
  snowsocial_db:
