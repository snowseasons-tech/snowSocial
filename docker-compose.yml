services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: snowsocial
      POSTGRES_USER: snowsocial_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowsocial_app -d snowsocial"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - snowsocial_db:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://snowsocial_app:${POSTGRES_PASSWORD}@db:5432/snowsocial
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  snowsocial_db:
